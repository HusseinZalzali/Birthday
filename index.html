<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Happy Birthday Hamoude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one full-screen pixel night sky; scenes swap in the middle like screens of a tiny game. */
:root{
  --navy:#0a1633; --navy2:#1b2d6b; --blue:#3a6fd0; --sky:#8fb4f0; --ice:#e6efff; --white:#ffffff;
  --display:"Press Start 2P", ui-monospace, "Courier New", monospace;
  --body:"VT323", ui-monospace, "Courier New", monospace;
  --px:6px; --kpx:5px;
  --ol2:-2px -2px 0 var(--navy),2px -2px 0 var(--navy),2px 2px 0 var(--navy),-2px 2px 0 var(--navy),0 2px 0 var(--navy),0 -2px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy);
  --ol:-3px -3px 0 var(--navy),0 -3px 0 var(--navy),3px -3px 0 var(--navy),3px 0 0 var(--navy),3px 3px 0 var(--navy),0 3px 0 var(--navy),-3px 3px 0 var(--navy),-3px 0 0 var(--navy);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--navy);color:var(--white);font-family:var(--body);font-size:22px;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas.px,#sky{image-rendering:pixelated;image-rendering:crisp-edges}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;z-index:5;display:flex;gap:6px;transition:opacity .4s}
body[data-scene="s-lock"] #hud{opacity:0}
#stage{position:relative;z-index:1;height:100%}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,48px);padding:56px 16px 28px;opacity:0;visibility:hidden;transition:opacity .45s steps(5),visibility 0s .45s;flex-wrap:wrap;align-content:center;text-align:center}
.scene.on{opacity:1;visibility:visible;transition:opacity .45s steps(5)}

/* pixel boxes: notched corners via stacked shadows */
.box{background:var(--white);color:var(--navy);box-shadow:0 -4px 0 0 var(--navy),0 4px 0 0 var(--navy),-4px 0 0 0 var(--navy),4px 0 0 0 var(--navy),8px 8px 0 0 rgba(4,10,30,.55)}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.5;text-wrap:balance;margin:0}
h1{font-size:clamp(18px,4.2vw,40px);color:var(--white);text-shadow:var(--ol),6px 6px 0 var(--blue),9px 9px 0 var(--navy)}
h2{font-size:clamp(13px,2.4vw,20px);color:var(--white);text-shadow:var(--ol),5px 5px 0 var(--navy2)}
.btn{font-family:var(--display);font-size:clamp(11px,1.6vw,14px);border:0;cursor:pointer;padding:14px 20px;background:var(--blue);color:var(--white);box-shadow:0 -4px 0 0 var(--navy),0 4px 0 0 var(--navy),-4px 0 0 0 var(--navy),4px 0 0 0 var(--navy),inset -4px -4px 0 0 var(--navy2);text-decoration:none;display:inline-block}
.btn:hover{background:#4d82e6}
.btn:active{transform:translate(2px,2px)}
.btn:focus-visible,.key:focus-visible,.gift:focus-visible,.envelope:focus-visible{outline:3px dashed var(--white);outline-offset:6px}
.next{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px}
.col{display:flex;flex-direction:column;align-items:center;gap:18px;min-width:0}
.couple{display:flex;align-items:flex-end;gap:calc(var(--px)*.5);position:relative}
.couple .float{position:absolute;left:50%;top:calc(var(--px)*-8);transform:translateX(-50%);animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
.hop{animation:hop 1s steps(2) infinite}
.hop:nth-child(2){animation-delay:.5s}
@keyframes hop{50%{transform:translateY(calc(var(--px)*-1))}}

/* lock */
.lock{padding:22px 22px 26px;display:flex;flex-direction:column;align-items:center;gap:16px;width:min(340px,100%)}
.lock h2{color:var(--navy);text-shadow:none;font-size:14px}
.slots{display:flex;gap:10px}
.slot{width:38px;height:44px;display:grid;place-items:center;font-family:var(--display);font-size:16px;color:var(--white);background:var(--navy2);box-shadow:0 -3px 0 0 var(--navy),0 3px 0 0 var(--navy),-3px 0 0 0 var(--navy),3px 0 0 0 var(--navy)}
.slot.filled{background:var(--blue)}
.keys{display:grid;grid-template-columns:repeat(3,auto);gap:8px 14px}
.key{position:relative;border:0;background:none;padding:0;cursor:pointer;line-height:0}
.key span{position:absolute;inset:0 0 18% 0;display:grid;place-items:center;font-family:var(--display);font-size:13px;color:var(--navy);line-height:1}
.key:hover canvas{filter:brightness(.92)}
.key:active{transform:translateY(2px)}
.hint{font-size:20px;color:#4a5a86;margin:0}
.shake{animation:shake .4s steps(4)}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* speech */
.bubble{padding:16px 22px;font-size:clamp(22px,3vw,30px);line-height:1.15;max-width:420px;text-align:left;position:relative;min-height:2.4em}
.bubble::after{content:"";position:absolute;left:-16px;bottom:18px;width:12px;height:12px;background:var(--white);box-shadow:-4px 4px 0 0 var(--navy),0 4px 0 0 var(--navy),-4px 0 0 0 var(--navy)}
.caret::after{content:"_";animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* gifts */
.gifts{display:flex;gap:clamp(18px,5vw,56px);flex-wrap:wrap;justify-content:center}
.gift{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--white);font-family:var(--display);font-size:11px;padding:0}
.gift canvas{animation:hop 1.4s steps(2) infinite}
.gift:nth-child(2) canvas{animation-delay:.45s}.gift:nth-child(3) canvas{animation-delay:.9s}
.gift:hover canvas{filter:brightness(1.1)}
.gift.done canvas{animation:none;opacity:.55}
.gift.done .lbl::after{content:" ✓"}
.progress{font-size:22px;color:var(--ice);margin:0}

/* letter */
.envelope{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:18px;color:var(--white);font-family:var(--display);font-size:12px;padding:0}
.envelope canvas{animation:wiggle 1.2s steps(2) infinite}
@keyframes wiggle{50%{transform:rotate(-4deg)}}
.paper{background:var(--ice);color:var(--navy);width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;padding:26px 28px 30px;text-align:left;font-size:clamp(22px,2.6vw,28px);line-height:1.25;background-image:repeating-linear-gradient(transparent 0 calc(1.25em - 2px),#c3d4f5 calc(1.25em - 2px) 1.25em);background-attachment:local;background-position:0 26px;box-shadow:0 -4px 0 0 var(--navy),0 4px 0 0 var(--navy),-4px 0 0 0 var(--navy),4px 0 0 0 var(--navy),8px 8px 0 0 rgba(4,10,30,.55)}
.paper .to{font-family:var(--display);font-size:12px;margin:0 0 14px;color:var(--blue)}
.paper p{margin:0;white-space:pre-wrap}

/* photos */
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 22px;width:min(880px,100%)}
.win{min-width:0}
.win:nth-child(1){transform:rotate(-2deg)}.win:nth-child(2){transform:rotate(2.5deg) translateY(10px)}
.win:nth-child(3){transform:rotate(1.5deg)}.win:nth-child(4){transform:rotate(-2.5deg) translateY(6px)}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--blue);color:var(--white);font-family:var(--display);font-size:8px;padding:6px 8px;gap:6px}
.bar i{font-style:normal;letter-spacing:3px}
.shot{aspect-ratio:3/4;max-width:100%;background:var(--ice);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#5a6c9c;font-size:20px;overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.stk{position:absolute;pointer-events:none}

/* song */
.songnote{max-width:340px;display:flex;flex-direction:column;gap:16px;align-items:center}
.songnote h1{font-size:clamp(20px,4vw,36px)}
.songnote p{margin:0;font-size:clamp(22px,2.6vw,28px);line-height:1.2;color:var(--ice)}

.progress,.songnote p,.gift,.envelope,.tvplay small{text-shadow:var(--ol2)}
/* phone-first navigation */
.navrow{flex:0 0 100%;display:flex;justify-content:center}
.btn.big{font-size:14px;padding:18px 26px;min-height:56px}
.btn.cta{background:var(--white);color:var(--navy);animation:pulse 1.2s steps(2) infinite;box-shadow:0 -4px 0 0 var(--navy),0 4px 0 0 var(--navy),-4px 0 0 0 var(--navy),4px 0 0 0 var(--navy),inset -4px -4px 0 0 #bcd2fb,0 0 0 8px rgba(143,180,240,.35)}
.btn.cta:hover{background:var(--ice)}
.btn.ghost{background:var(--navy2)}
.btn.ghost:hover{background:var(--blue)}
.scene{overflow-y:auto;align-content:safe center;justify-content:safe center}
/* tv */
.tv{width:min(480px,100%);position:relative;padding-top:46px}
.ant{position:absolute;top:0;left:0;right:0;height:50px}
.ant span{position:absolute;bottom:0;left:50%;width:6px;height:52px;background:var(--navy);transform-origin:bottom center}
.ant span:first-child{transform:rotate(-38deg)}.ant span:last-child{transform:rotate(38deg)}
.ant span::after{content:"";position:absolute;top:-8px;left:-4px;width:14px;height:14px;background:var(--white);box-shadow:0 0 0 3px var(--navy)}
.tvbody{display:flex;gap:14px;padding:16px;background:var(--blue);box-shadow:0 -4px 0 0 var(--navy),0 4px 0 0 var(--navy),-4px 0 0 0 var(--navy),4px 0 0 0 var(--navy),inset -6px -6px 0 0 var(--navy2),inset 6px 6px 0 0 #6f9be8,10px 10px 0 0 rgba(4,10,30,.55)}
.tvscreen{flex:1;min-width:0;aspect-ratio:16/9;max-width:100%;background:#050a1c;position:relative;overflow:hidden;border-radius:18px/22px;box-shadow:0 0 0 5px var(--navy)}
.tvscreen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.18) 0 2px,transparent 2px 4px);border-radius:inherit;box-shadow:inset 0 0 40px rgba(143,180,240,.35)}
.tvscreen.on::after{background:none}
#static{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;opacity:.55}
.tvscreen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.tvplay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--white);text-decoration:none;font-family:var(--display);font-size:11px;text-shadow:2px 2px 0 var(--navy)}
.tvplay .big{font-size:26px;width:64px;height:52px;display:grid;place-items:center;background:var(--blue);box-shadow:0 -4px 0 0 var(--navy),0 4px 0 0 var(--navy),-4px 0 0 0 var(--navy),4px 0 0 0 var(--navy);text-shadow:none;animation:pulse 1.2s steps(2) infinite}
.tvplay small{font-family:var(--body);font-size:20px;color:var(--ice)}
.tvplay:hover .big{background:#4d82e6}
.tvplay:focus-visible{outline:3px dashed var(--white);outline-offset:-10px}
@keyframes pulse{50%{transform:scale(1.08)}}
.tvside{width:40px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.tvside i{width:24px;height:24px;background:var(--ice);box-shadow:0 0 0 4px var(--navy);border-radius:50%}
.tvside b{width:30px;height:4px;background:var(--navy)}
.legs{display:flex;justify-content:space-between;padding:0 18%}
.legs span{width:14px;height:16px;background:var(--navy)}
.tvshow{position:absolute;inset:0}
.tvshow img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.9) contrast(1.05);transition:opacity .6s steps(4)}
.tveq{position:absolute;left:0;right:0;bottom:0;height:34%;display:flex;align-items:flex-end;justify-content:center;gap:5px;padding:0 12% 8px;background:linear-gradient(transparent,rgba(5,10,28,.75))}
.tveq i{flex:1;max-width:14px;height:20%;background:var(--sky);box-shadow:0 0 0 2px var(--navy);animation:eq .9s steps(4) infinite}
.tveq i:nth-child(2n){animation-delay:-.3s}.tveq i:nth-child(3n){animation-delay:-.55s}.tveq i:nth-child(4n){animation-delay:-.15s}
.paused .tveq i{animation-play-state:paused}
@keyframes eq{0%{height:20%}25%{height:90%}50%{height:45%}75%{height:70%}100%{height:20%}}
.tvpause{position:absolute;top:10px;right:10px;z-index:2;border:0;cursor:pointer;font-family:var(--display);font-size:10px;padding:8px 9px;background:var(--blue);color:var(--white);box-shadow:0 -3px 0 0 var(--navy),0 3px 0 0 var(--navy),-3px 0 0 0 var(--navy),3px 0 0 0 var(--navy)}
/* end */
.rise{position:fixed;bottom:-40px;z-index:2;pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh)}}

@media (max-width:640px){
  .scene{padding:52px 16px 24px;gap:16px}
  #s-intro,#s-title{flex-direction:column;flex-wrap:nowrap}
  #s-intro .navrow,#s-title .navrow{flex:0 0 auto;width:100%}
  .gift canvas{width:calc(12 * 6px)!important;height:calc(12 * 6px)!important}
  .bubble{max-width:100%}
  .bubble::after{left:50%;bottom:auto;top:-16px;transform:translateX(-50%);box-shadow:-4px -4px 0 0 var(--navy),0 -4px 0 0 var(--navy),-4px 0 0 0 var(--navy),4px 0 0 0 var(--navy)}
  #s-title .col:first-child{order:0}
  .paper{max-height:58svh;padding:20px 20px 24px}
  .songnote{gap:10px}
  #s-title h1{font-size:22px}
  #s-title .btn.big{width:auto;min-width:200px}
  .songnote h1{font-size:20px}
  .songnote h1 br{display:none}
  .gifts{gap:22px}
  .btn.big{width:100%;max-width:320px}
  .tvside{width:26px}.tvside i{width:16px;height:16px}.tvside b{width:20px}.tvbody{padding:12px;gap:10px}
  :root{--px:4px;--kpx:4px}
  .scene{gap:18px}
  .lock{padding:16px 16px 20px;gap:12px}
  #s-lock .couple{display:none}
  .photos{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 14px;width:min(330px,100%)}
}
@media (max-height:560px){:root{--px:4px;--kpx:4px}.scene{gap:16px}.lock{gap:10px;padding:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div id="hud" aria-label="Gifts opened"></div>

<main id="stage">
  <section class="scene on" id="s-lock" aria-label="Password">
    <div class="couple"><span data-s="heartBig" class="float"></span><span data-s="boy" class="hop"></span><span data-s="girl" class="hop"></span></div>
    <div class="box lock" id="lockbox">
      <h2 id="lockTitle">Guess the password</h2>
      <div class="slots" id="slots" aria-live="polite"></div>
      <div class="keys" id="keys"></div>
      <p class="hint" id="hint">hint: a very special day (dd mm)</p>
    </div>
  </section>

  <section class="scene" id="s-title" aria-label="Title">
    <div class="col">
      <div class="couple"><span data-s="heartBig" class="float"></span><span data-s="boy" class="hop"></span><span data-s="girl" class="hop"></span></div>
    </div>
    <div class="col">
      <h1>Happy<br>Birthday,<br>Hamoude!</h1>
      <button class="btn big cta" data-go="s-intro">Start ▶</button>
    </div>
  </section>

  <section class="scene" id="s-intro" aria-label="Intro">
    <span data-s="girl" class="hop"></span>
    <div class="box bubble" id="introText"></div>
    <div class="navrow"><button class="btn big cta" id="introNext" data-go="s-gifts" hidden>Open my gifts 🎁</button></div>
  </section>

  <section class="scene" id="s-gifts" aria-label="Choose your gifts">
    <div class="col" style="gap:34px">
      <h1 style="font-size:clamp(16px,3.4vw,30px)">Choose your gifts</h1>
      <div class="gifts">
        <button class="gift" data-gift="letter" data-go="s-letter"><span data-s="gift"></span><span class="lbl">letter</span></button>
        <button class="gift" data-gift="photos" data-go="s-photos"><span data-s="gift"></span><span class="lbl">photos</span></button>
        <button class="gift" data-gift="song" data-go="s-song"><span data-s="gift"></span><span class="lbl">song</span></button>
      </div>
      <p class="progress" id="progress">open all 3 🤍</p>
      <button class="btn big cta" id="toEnd" data-go="s-end" hidden>One more thing ▶</button>
    </div>
  </section>

  <section class="scene" id="s-letter" aria-label="A letter for you">
    <button class="envelope" id="envelope"><h1 style="font-size:clamp(16px,3.4vw,30px)">A letter<br>for you</h1><span data-s="envelope"></span><span>tap to open</span></button>
    <div class="paper" id="paper" hidden><div class="to">To: Hamoude 🤍</div><p id="letterText" class="caret"></p></div>
    <div class="navrow"><button class="btn big ghost" data-go="s-gifts">◀ Back to gifts</button></div>
  </section>

  <section class="scene" id="s-photos" aria-label="Photos">
    <div class="col" style="width:min(880px,100%)">
      <h2>Happy Birthday, Hamoude!</h2>
      <div class="photos" id="photos"></div>
    </div>
    <div class="navrow"><button class="btn big ghost" data-go="s-gifts">◀ Back to gifts</button></div>
  </section>

  <section class="scene" id="s-song" aria-label="Song for you">
    <div class="tv">
      <div class="ant" aria-hidden="true"><span></span><span></span></div>
      <div class="tvbody">
        <div class="tvscreen" id="tvscreen">
          <canvas id="static" aria-hidden="true"></canvas>
          <div class="tvshow" id="tvshow" hidden><img id="tvimg" alt=""><div class="tveq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><button class="tvpause" id="tvpause" type="button" aria-label="Pause">❚❚</button></div>
          <audio id="song" preload="auto"></audio>
          <a class="tvplay" id="play" href="https://youtu.be/CPE0Z_pQ26E" target="_blank" rel="noopener"><span class="big">▶</span><span>Shedeeny · شديني</span><small>TUL8TE</small></a>
        </div>
        <div class="tvside" aria-hidden="true"><i></i><i></i><b></b><b></b><b></b></div>
      </div>
      <div class="legs" aria-hidden="true"><span></span><span></span></div>
    </div>
    <div class="songnote">
      <h1>Song <br>for you</h1>
      <p>The song that reminds me of my favorite phase in our story 🤍</p>
    </div>
    <div class="navrow"><button class="btn big ghost" data-go="s-gifts">◀ Back to gifts</button></div>
  </section>

  <section class="scene" id="s-end" aria-label="The end">
    <div class="couple"><span data-s="heartBig" class="float"></span><span data-s="boy" class="hop"></span><span data-s="girl" class="hop"></span></div>
    <div class="col">
      <div class="box bubble" id="endText"></div>
      <button class="btn" id="again">Play again</button>
    </div>
  </section>
</main>

<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- pixel sprites ---------- */
const PAL = {
  h:'#1d1a2c', s:'#f6d3b8', e:'#1d1a2c', b:'#f2a7b6', r:'#c4506c',
  n:'#1b2d6b', w:'#ffffff', d:'#232a4d', k:'#0e1022', c:'#3a6fd0'
};
const S = {
  boy:["...hhhhhh...","..hhhhhhhh..",".hhhhhhhhhh.",".hhshhhhshh.",".hssssssssh.",".ssessssess.",".sbssrrssbs.","..ssssssss..","....ssss....","..nnwwwwnn..",".nnnwwwwnnn.",".nnnwwwwnnn.",".nnnnwwnnnn.","snnnnwwnnnns","s.nnnnnnnn.s","..nnnnnnnn..","..dddddddd..","..ddd..ddd..","..ddd..ddd..","..ddd..ddd..",".kkkk..kkkk."],
  girl:["...hhhhhh...","..hhhhhhhh..",".hhhhhhhhhh.",".hhhhhhhhhh.","hhsssssssshh","hssessssessh","hsbssrrssbsh","hhsssssssshh","hh..ssss..hh","hhwwwwwwwwhh","hwwwwwwwwwwh",".wwwwwwwwww.","swwwwwwwwwws","s.cccccccc.s","..cccccccc..",".cccccccccc.",".cccccccccc.","...ss..ss...","...ss..ss...","...ss..ss...","..kkk..kkk.."],
  key:[".ooo...ooo.","owwwo.owwwo","owlwwowwwwo","owwwwwwwwwo","owwwwwwwwwo",".owwwwwwwo.","..owwwwwo..","...owwwo...","....owo....",".....o....."],
  heart:[".oo.oo.","owwowwo","owwwwwo",".owwwo.","..owo..","...o..."],
  gift:["..rrr..rrr..",".r...rr...r.","..rrrrrrrr..","ollllrrllllo","ollllrrllllo","oooooooooooo",".owwwrrwwwo.",".owwwrrwwwo.",".owwwrrwwwo.",".owwwrrwwwo.",".owwwrrwwwo.",".oooooooooo."],
  envelope:["oooooooooooooooo","oowwwwwwwwwwwwoo","owowwwwwwwwwwowo","owwowwwwwwwwowwo","owwwowwwwwwowwwo","owwwwowwwwowwwwo","owwwwwohhowwwwwo","owwwwwhhhhwwwwwo","owwwwwwhhwwwwwwo","owwwwwwwwwwwwwwo","owwwwwwwwwwwwwwo","oooooooooooooooo"],
  star:["..w..",".www.","wwwww",".www.","..w.."]
};
const KEYPAL = {o:'#0a1633', w:'#ffffff', l:'#bcd2fb'};
function sprite(name, pal = PAL, unit = 'var(--px)', mul = 1){
  const map = S[name], h = map.length, w = map[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.className = 'px';
  const x = c.getContext('2d');
  map.forEach((row, y) => [...row].forEach((ch, i) => { if (pal[ch]) { x.fillStyle = pal[ch]; x.fillRect(i, y, 1, 1); } }));
  c.style.width = `calc(${w * mul} * ${unit})`; c.style.height = `calc(${h * mul} * ${unit})`;
  c.style.display = 'block';
  return c;
}
const presets = {
  boy: () => sprite('boy'),
  girl: () => sprite('girl'),
  heartBig: () => sprite('heart', {o:'#0a1633', w:'#7fa8ee'}),
  gift: () => sprite('gift', {r:'#3a6fd0', o:'#0a1633', l:'#8fb4f0', w:'#ffffff'}, 'var(--px)', 1.1),
  envelope: () => sprite('envelope', {o:'#0a1633', w:'#ffffff', h:'#3a6fd0'}, 'var(--px)', 1.3)
};
document.querySelectorAll('[data-s]').forEach(el => el.appendChild(presets[el.dataset.s]()));

/* ---------- HUD hearts ---------- */
const hud = document.getElementById('hud');
const opened = new Set();
function drawHud(){
  hud.innerHTML = '';
  for (let i = 0; i < 3; i++) hud.appendChild(sprite('heart', i < opened.size ? {o:'#0a1633', w:'#7fa8ee'} : {o:'#e6efff', w:'#13265a'}, '4px'));
}
drawHud();

/* ---------- navigation ---------- */
const enter = {};
let typer = 0;
function go(id){
  typer++;
  document.querySelectorAll('.scene').forEach(s => s.classList.toggle('on', s.id === id));
  document.body.dataset.scene = id;
  enter[id] && enter[id]();
}
document.body.dataset.scene = 's-lock';
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]'); if (!t) return;
  if (t.dataset.gift) { opened.add(t.dataset.gift); t.classList.add('done'); drawHud(); }
  go(t.dataset.go);
});

function type(el, text, speed = 35, done){
  const my = ++typer;
  el.textContent = ''; el.classList.add('caret');
  const chars = [...text];
  if (reduce) { el.textContent = text; el.classList.remove('caret'); done && done(); return; }
  let i = 0;
  (function step(){
    if (my !== typer) return;
    el.textContent += chars[i++] || '';
    if (i < chars.length) setTimeout(step, chars[i-1] === '\n' ? 250 : speed); else { el.classList.remove('caret'); done && done(); }
  })();
}

/* ---------- lock ---------- */
const CODE = '1612';
let code = '';
const slots = document.getElementById('slots'), keys = document.getElementById('keys');
const lockbox = document.getElementById('lockbox'), lockTitle = document.getElementById('lockTitle'), hint = document.getElementById('hint');
function renderSlots(){
  slots.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const d = document.createElement('div'); d.className = 'slot' + (code[i] ? ' filled' : '');
    d.textContent = code[i] || '★'; slots.appendChild(d);
  }
}
['1','2','3','4','5','6','7','8','9','C','0','⌫'].forEach(k => {
  const b = document.createElement('button'); b.className = 'key'; b.type = 'button';
  b.setAttribute('aria-label', k === 'C' ? 'Clear' : k === '⌫' ? 'Delete' : k);
  b.appendChild(sprite('key', KEYPAL, 'var(--kpx)'));
  const s = document.createElement('span'); s.textContent = k; b.appendChild(s);
  b.addEventListener('click', () => press(k));
  keys.appendChild(b);
});
let locked = false;
function press(k){
  if (locked) return;
  if (k === 'C') code = '';
  else if (k === '⌫') code = code.slice(0, -1);
  else if (code.length < 4) code += k;
  renderSlots();
  if (code.length === 4) {
    locked = true;
    if (code === CODE) {
      lockTitle.textContent = 'You got it!'; hint.textContent = 'welcome, my love 🤍';
      setTimeout(() => go('s-title'), 1100);
    } else {
      hint.textContent = 'not quite… try again 🤍';
      lockbox.classList.remove('shake'); void lockbox.offsetWidth; lockbox.classList.add('shake');
      setTimeout(() => { code = ''; renderSlots(); locked = false; }, 650);
    }
  }
}
document.addEventListener('keydown', e => {
  if (document.body.dataset.scene !== 's-lock') return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('⌫');
});
renderSlots();

};

const photos = document.getElementById('photos');
PHOTOS.forEach((src, i) => {
  const w = document.createElement('div'); w.className = 'win box';
  w.innerHTML = `<div class="bar"><span>us_${i+1}.png</span><i>_ □ x</i></div>`;
  const shot = document.createElement('div'); shot.className = 'shot';
  if (src) { const img = new Image(); img.src = src; img.alt = `Photo ${i+1}`; shot.appendChild(img); }
  else { shot.appendChild(sprite('heart', {o:'#3a6fd0', w:'#ffffff'}, '5px')); const t = document.createElement('span'); t.textContent = `photo ${i+1}`; shot.appendChild(t); }

});

/* ---------- song ---------- */
const YT = 'CPE0Z_pQ26E';
const tvscreen = document.getElementById('tvscreen'), playBtn = document.getElementById('play'), stat = document.getElementById('static');
// Claude's preview can't show YouTube inside a page, so there the button opens YouTube; anywhere else it plays on the TV.
const canEmbed = !!location.hostname && !/claude|anthropic/i.test(location.hostname);
const SONG_SRC = null; // song file, played right inside the TV
const song = document.getElementById('song'), tvshow = document.getElementById('tvshow'), tvimg = document.getElementById('tvimg'), tvpause = document.getElementById('tvpause');
let slide = 0, slideTimer;
function showSlide(){ tvimg.src = PHOTOS[slide++ % PHOTOS.length]; }
if (SONG_SRC) song.src = SONG_SRC;
function playSong(){
  song.play().catch(() => {});
  playBtn.hidden = true; stat.hidden = true; tvshow.hidden = false; tvscreen.classList.add('on'); tvshow.classList.remove('paused');
  tvpause.textContent = '❚❚'; tvpause.setAttribute('aria-label', 'Pause');
  if (!tvimg.src) showSlide();
  clearInterval(slideTimer); slideTimer = setInterval(showSlide, 4000);
}
function pauseSong(){ song.pause(); tvshow.classList.add('paused'); clearInterval(slideTimer); tvpause.textContent = '▶'; tvpause.setAttribute('aria-label', 'Play'); }
tvpause.addEventListener('click', () => song.paused ? playSong() : pauseSong());
song.addEventListener('ended', pauseSong);
playBtn.addEventListener('click', e => {
  if (SONG_SRC) { e.preventDefault(); playSong(); return; }
  if (!canEmbed) return;
  e.preventDefault();
  const f = document.createElement('iframe');
  f.src = `https://www.youtube.com/embed/${YT}?autoplay=1&rel=0&playsinline=1`;
  f.title = 'Shedeeny by TUL8TE';
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.allowFullscreen = true;
  tvscreen.appendChild(f); playBtn.hidden = true; stat.hidden = true; tvscreen.classList.add('on');
});
function resetTv(){ tvscreen.querySelector('iframe')?.remove(); song.pause(); song.currentTime = 0; clearInterval(slideTimer); tvshow.hidden = true; playBtn.hidden = false; stat.hidden = false; tvscreen.classList.remove('on'); }
const sg = stat.getContext('2d'); stat.width = 96; stat.height = 54;
function noise(){
  const img = sg.createImageData(96, 54);
  for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 150 | 0; img.data[i] = v * .7; img.data[i+1] = v * .8; img.data[i+2] = v + 60; img.data[i+3] = 255; }
  sg.putImageData(img, 0, 0);
}
noise();
if (!reduce) setInterval(() => { if (document.body.dataset.scene === 's-song' && !stat.hidden) noise(); }, 110);

/* ---------- end ---------- */
const endText = document.getElementById('endText');
let riseTimer;
enter['s-end'] = () => {
  type(endText, 'Enjoy your birthday, Hamoude!!!! 🤍');
  if (reduce) return;
  clearInterval(riseTimer);
  let n = 0;
  riseTimer = setInterval(() => {
    if (document.body.dataset.scene !== 's-end' || n++ > 40) return clearInterval(riseTimer);
    const h = sprite(Math.random() < .7 ? 'heart' : 'star', Math.random() < .5 ? {o:'#0a1633', w:'#7fa8ee'} : {o:'#0a1633', w:'#ffffff'}, (3 + Math.random()*3|0) + 'px');
    h.classList.add('rise'); h.style.left = (Math.random()*96) + 'vw'; h.style.animationDuration = (5 + Math.random()*4) + 's';
    document.body.appendChild(h); setTimeout(() => h.remove(), 9500);
  }, 280);
};
document.getElementById('again').addEventListener('click', () => {
  opened.clear(); drawHud();
  document.querySelectorAll('.gift').forEach(g => g.classList.remove('done'));
  resetTv();
  go('s-title');
});

/* ---------- pixel sky ---------- */
const sky = document.getElementById('sky'), g = sky.getContext('2d');
const U = 4;
let W, H, stars = [], clouds = [], t = 0;
const STOPS = [[0,[7,15,42]],[.5,[22,48,122]],[.8,[58,111,208]],[1,[156,192,245]]];
function col(p){
  for (let i = 1; i < STOPS.length; i++) if (p <= STOPS[i][0]) {
    const [a, ca] = STOPS[i-1], [b, cb] = STOPS[i], k = (p - a) / (b - a);
    return `rgb(${ca.map((v, j) => Math.round(v + (cb[j] - v) * k)).join(',')})`;
  }
}
function resize(){
  W = Math.ceil(innerWidth / U); H = Math.ceil(innerHeight / U);
  sky.width = W; sky.height = H;
  stars = Array.from({length: Math.round(W * H / 140)}, () => ({x: Math.random()*W|0, y: Math.random()*H*.62|0, p: Math.random()*6.3, big: Math.random() < .12}));
  const n = Math.max(4, W / 45 | 0);
  clouds = Array.from({length: Math.min(n, 4)}, (_, i) => ({x: (i / Math.min(n, 4)) * W * 1.2 - 10, y: 6 + Math.random() * Math.min(10, H * .06), s: .5 + Math.random() * .35, v: .02 + Math.random() * .03}));
  draw();
}
function cloud(x, y, s, main = '#ffffff', shade = '#c7d9fb'){
  const u = Math.max(2, Math.round(3 * s)); x |= 0; y |= 0;
  g.fillStyle = shade; g.fillRect(x + u, y + 2*u, 9*u, u);
  g.fillStyle = main;
  g.fillRect(x, y, 11*u, 2*u);
  g.fillRect(x + u, y - u, 4*u, u);
  g.fillRect(x + 3*u, y - 2*u, 4*u, 2*u);
  g.fillRect(x + 6*u, y - u, 3*u, u);
}
function draw(){
  const bands = 18;
  for (let y = 0; y < H; y++) { g.fillStyle = col(Math.floor((y / H) * bands) / bands); g.fillRect(0, y, W, 1); }
  stars.forEach(s => {
    const on = reduce || Math.sin(t * .08 + s.p) > -.3;
    if (!on) return;
    g.fillStyle = '#ffffff'; g.fillRect(s.x, s.y, 1, 1);
    if (s.big) { g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(s.x-1, s.y, 1, 1); g.fillRect(s.x+1, s.y, 1, 1); g.fillRect(s.x, s.y-1, 1, 1); g.fillRect(s.x, s.y+1, 1, 1); }
  });
  clouds.forEach(c => { cloud(c.x, c.y, c.s); if (!reduce) { c.x += c.v; if (c.x > W + 10) c.x = -40 * c.s; } });
  // cloud floor
  const step = 14, off = (t * .06) % step;
  g.fillStyle = '#c7d9fb';
  for (let x = -off - step; x < W + step; x += step) g.fillRect(x|0, H - 9, 10, 3);
  g.fillStyle = '#eef4ff';
  for (let x = -off - step; x < W + step; x += step) { g.fillRect((x + 2)|0, H - 8, 7, 2); g.fillRect(x|0, H - 6, 12, 2); }
  g.fillRect(0, H - 4, W, 4);
}
let last = 0;
function loop(ts){ if (ts - last > 90) { t++; draw(); last = ts; } requestAnimationFrame(loop); }
addEventListener('resize', resize);
resize();
if (!reduce) requestAnimationFrame(loop);
})();
